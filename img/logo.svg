<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="The True Hall of Fame">
  <defs>
    <linearGradient id="thof-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c184"/>
      <stop offset="0.5" stop-color="#b8873b"/>
      <stop offset="1" stop-color="#7c5620"/>
    </linearGradient>
    <path id="thof-top" d="M 31,120 A 89,89 0 0 1 209,120"/>
    <path id="thof-bot" d="M 36,120 A 84,84 0 0 0 204,120"/>
  </defs>

  <!-- field -->
  <circle cx="120" cy="120" r="118" fill="#10241c"/>

  <!-- brass rim -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="url(#thof-brass)" stroke-width="6"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#8c6423" stroke-width="1.4"/>
  <circle cx="120" cy="120" r="72"  fill="none" stroke="#8c6423" stroke-width="1.4"/>

  <!-- circular type -->
  <g fill="#d8a85c" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" letter-spacing="3.5">
    <text font-size="16" text-anchor="middle">
      <textPath href="#thof-top" startOffset="50%">THE TRUE HALL OF FAME</textPath>
    </text>
    <text font-size="12.5" text-anchor="middle" fill="#b8873b" letter-spacing="4">
      <textPath href="#thof-bot" startOffset="50%">STAT ABOVE AVERAGE</textPath>
    </text>
  </g>

  <!-- side separators -->
  <g fill="#d8a85c">
    <rect x="26.5" y="116.5" width="7" height="7" transform="rotate(45 30 120)"/>
    <rect x="206.5" y="116.5" width="7" height="7" transform="rotate(45 210 120)"/>
  </g>

  <!-- baseball -->
  <circle cx="120" cy="120" r="52" fill="#efe6d0" stroke="#8c6423" stroke-width="2"/>
  <g fill="none" stroke="#9b3a2e" stroke-linecap="round">
    <path d="M 92,79 C 80,100 80,140 92,161" stroke-width="2"/>
    <path d="M 148,79 C 160,100 160,140 148,161" stroke-width="2"/>
    <path d="M 92,79 C 80,100 80,140 92,161" stroke-width="5.5" stroke-dasharray="0.5 5"/>
    <path d="M 148,79 C 160,100 160,140 148,161" stroke-width="5.5" stroke-dasharray="0.5 5"/>
  </g>

  <!-- monogram -->
  <text x="120" y="121" text-anchor="middle" dominant-baseline="central"
        font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700"
        font-size="66" fill="#10241c" letter-spacing="1">T</text>
</svg>
